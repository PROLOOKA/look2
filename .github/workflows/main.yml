name: Infinite Restream
on:
  workflow_dispatch: # تشغيل يدوي
  schedule:
    - cron: '0 */6 * * *' # تشغيل تلقائي كل 6 ساعات كاحتياط

permissions:
  contents: write
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Stream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x restream.sh
          ./restream.sh &
          
          # تحديث الملفات على GitHub كل دقيقتين لمدة 5 ساعات ونصف
          for i in {1..165}; do
            sleep 120
            git config --global user.name "StreamBot"
            git config --global user.email "bot@github.com"
            git add hls/
            git commit -m "Live Update" || continue
            git push origin main
          done

          # إعادة تشغيل الأكشن لنفسه قبل انتهاء وقت الـ 6 ساعات
          gh workflow run "Infinite Restream"
