name: 24/7 Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: تشغيل البث
        run: |
          chmod +x restream.sh
          ./restream.sh &
          
          while true; do
            sleep 10
            git config user.name "StreamBot"
            git config user.email "bot@github.com"
            git add hls/
            git commit -m "Live $(date +%H:%M:%S)" || true
            git push origin main || true
          done
