name: 24/7 Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تثبيت FFmpeg و inotify-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg inotify-tools

      - name: إعداد Git
        run: |
          git config user.name "StreamBot"
          git config user.email "bot@github.com"

      - name: تشغيل البث مع رفع مباشر
        run: |
          chmod +x restream.sh
          
          # دالة لرفع الملفات فوراً
          upload_files() {
            while true; do
              sleep 2
              git add hls/*.ts hls/*.m3u8 2>/dev/null
              git diff --cached --quiet || {
                git commit -m "بث مباشر $(date +%Y-%m-%d_%H:%M:%S)"
                git push origin main
              }
            done
          }
          
          # تشغيل الرفع المتوازي
          upload_files &
          UPLOAD_PID=$!
          
          # تشغيل البث
          bash restream.sh
          
          kill $UPLOAD_PID 2>/dev/null
